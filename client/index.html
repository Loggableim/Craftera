<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craftera</title>
  <link rel="stylesheet" href="/shell/styles.css">
</head>
<body>
  <!-- Topbar-Navigation (AP-1.3): 5 Nav-Buttons -->
  <header class="topbar">
    <div class="topbar-brand">Craftera</div>
    <nav class="topbar-nav" id="topbar-nav">
      <button class="nav-btn" data-view="home" type="button">Home</button>
      <button class="nav-btn" data-view="discover" type="button">Discover</button>
      <button class="nav-btn" data-view="library" type="button">Library</button>
      <button class="nav-btn" data-view="create" type="button">Create</button>
      <button class="nav-btn" data-view="settings" type="button">Settings</button>
    </nav>
  </header>

  <!-- View-Container: jede View ist ein Platzhalter (Inhalte folgen in AP-1.5–1.9) -->
  <main class="view-container" id="view-container">
    <section class="view" data-view="home">
      <h2>Home</h2>
      <div class="home-section">
        <h3>Featured</h3>
        <div id="home-featured"></div>
      </div>
      <div class="home-section">
        <h3>Recently Played</h3>
        <div id="home-recently-played"></div>
      </div>
    </section>
    <section class="view" data-view="discover">
      <h2>Discover</h2>
      <div class="discover-search">
        <input type="search" id="discover-search" placeholder="Suche nach Name oder Tag…" aria-label="Experiences durchsuchen">
      </div>
      <div id="discover-list"></div>
    </section>
    <section class="view" data-view="library">
      <h2>Library</h2>
      <div id="library-list"></div>
    </section>
    <section class="view" data-view="create">
      <h2>Create</h2>
      <div class="create-hub">
        <h3>New Experience</h3>
        <form id="create-form" class="create-form">
          <label>
            Name
            <input type="text" id="create-name" name="name" required placeholder="z.B. Space Runner">
          </label>
          <label>
            Slug
            <input type="text" id="create-slug" name="slug" placeholder="z.B. space-runner">
          </label>
          <label>
            Tags (kommagetrennt)
            <input type="text" id="create-tags" name="tags" placeholder="action, arcade">
          </label>
          <button type="submit" class="btn-primary">Experience erstellen</button>
        </form>
        <p id="create-status" class="form-status" role="status"></p>
      </div>
    </section>
    <section class="view" data-view="settings">
      <h2>Settings</h2>
      <p>BYOK-Provider-Konfiguration (AP-1.9).</p>
    </section>
  </main>

  <script src="/shell/app.js"></script>
  <script src="/home/home.js"></script>
  <script src="/discover/discover.js"></script>
  <script src="/library/library.js"></script>
  <script src="/creator_hub/create.js"></script>
  <script>
    // Views beim Laden rendern (nachdem die jeweiligen Skripte geladen sind).
    window.craftera.renderHome();
    window.craftera.renderDiscover();
    window.craftera.renderLibrary();
    window.craftera.renderCreate();
  </script>
</body>
</html>
